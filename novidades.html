<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novidades — IbBot & IbTech · Ibmec BH</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/novidades.css">
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="/">
    <span class="logo-ib">Ib</span><span class="logo-bot">Bot</span>
    <span class="slash">/</span>
    <span class="logo-ib">Ib</span><span class="logo-tech">Tech</span>
  </a>
  <div class="nav-links">
    <a href="/ibbot">IbBot</a>
    <a href="/ibtech">IbTech</a>
    <a href="/#diretoria">Diretoria</a>
    <a href="/novidades" class="active">Novidades</a>
    <a href="/processo-seletivo">Processo Seletivo</a>
    <a href="/contato">Contato</a>
  </div>
  <div class="nav-right">
    <span class="nav-tag">Ibmec BH · 2026</span>
    <a class="nav-btn" href="/membros/login">Área de Membros →</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero" style="padding-top:52px">
  <div class="hero-grid"></div>
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="hero-kicker">
      <span class="kicker-dot-r"></span>
      IbBot
      <span style="color:var(--border2)">·</span>
      <span class="kicker-dot-b"></span>
      IbTech
    </div>
    <h1 class="hero-title">NOVIDADES</h1>
    <p class="hero-sub">Hackathons, projetos entregues e conhecimento das Ligas Tech Ibmec BH.</p>
  </div>
</div>

<!-- FILTROS -->
<div class="filters">
  <button class="filter-btn active" data-cat="">Todos</button>
  <button class="filter-btn" data-cat="hackathon">Hackathon</button>
  <button class="filter-btn" data-cat="projeto">Projeto</button>
  <button class="filter-btn" data-cat="conhecimento">Conhecimento</button>
</div>

<!-- POSTS -->
<section class="posts-section">
  <div id="posts-skeleton" hidden>
    <div style="height:180px;background:var(--bg2);border:1px solid var(--border);border-radius:6px"></div>
    <div style="height:180px;background:var(--bg2);border:1px solid var(--border);border-radius:6px"></div>
    <div style="height:180px;background:var(--bg2);border:1px solid var(--border);border-radius:6px"></div>
  </div>
  <div id="posts-grid"></div>
  <p id="posts-empty" hidden style="color:var(--muted);font-size:14px;text-align:center;padding:3rem 0">
    Nenhuma novidade publicada ainda.
  </p>
</section>

<script type="module" src="/assets/js/pages/novidades.js"></script>
<script src="/assets/js/global.js" defer></script>
</body>
</html>
