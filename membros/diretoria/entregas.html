<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entregas — Diretoria · IbBot & IbTech</title>
<link rel="icon" type="image/x-icon" href="/assets/icons/Documento-removebg-preview.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/global.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/dashboard-diretoria.css">
<link rel="stylesheet" href="/assets/css/pages/ux-improvements.css">
<link rel="stylesheet" href="/assets/css/ui/empty-state.css">
<link rel="stylesheet" href="/assets/css/ui/skeleton.css">
<link rel="stylesheet" href="/assets/css/ui/confirm.css">
<link rel="stylesheet" href="/assets/css/ui/a11y.css">
<link rel="stylesheet" href="/assets/css/shell.css">
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteúdo</a>
<main id="main-content" class="content" style="padding: var(--sp-6) var(--sp-7); max-width: 1200px">
  <div class="panel-full">
    <div class="panel-head">
      <div>
        <div class="panel-title">Entregas por tarefa</div>
        <div id="entregas-summary" style="font-size:12px;color:var(--muted);margin-top:.25rem" aria-live="polite"></div>
      </div>
      <div class="panel-actions" style="display:flex;gap:.5rem;align-items:center">
        <label class="sr-only" for="filter-entregas-aula">Filtrar por tarefa</label>
        <select id="filter-entregas-aula" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:3px;font-size:12px;outline:none;font-family:var(--font-body)">
          <option value="">Todas as tarefas</option>
        </select>
        <label class="sr-only" for="filter-entregas-status">Filtrar por status</label>
        <select id="filter-entregas-status" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:3px;font-size:12px;outline:none;font-family:var(--font-body)">
          <option value="">Todos os status</option>
          <option value="pendente">Pendentes</option>
          <option value="atrasada">Atrasadas</option>
          <option value="entregue">Entregues</option>
        </select>
      </div>
    </div>
    <table class="tbl" id="entregas-tbl">
      <caption class="sr-only">Situação das entregas de cada membro por tarefa</caption>
    </table>
  </div>
</main>
<script type="module" src="/assets/js/pages/entregas-diretoria.js"></script>
</body>
</html>
