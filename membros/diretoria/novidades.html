<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novidades — Diretoria · IbBot & IbTech</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/global.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/dashboard-diretoria.css">
<link rel="stylesheet" href="/assets/css/pages/ux-improvements.css">
<link rel="stylesheet" href="/assets/css/pages/novidades.css">
<link rel="stylesheet" href="/assets/css/ui/empty-state.css">
<link rel="stylesheet" href="/assets/css/ui/skeleton.css">
<link rel="stylesheet" href="/assets/css/ui/confirm.css">
<link rel="stylesheet" href="/assets/css/ui/a11y.css">
<link rel="stylesheet" href="/assets/css/shell.css">
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteúdo</a>
<main id="main-content" class="content" style="padding: var(--sp-6) var(--sp-7); max-width: 1200px">
  <div style="display:grid;grid-template-columns:1fr 380px;gap:var(--sp-4)">

    <!-- Lista de posts -->
    <div>
      <div style="font-family:var(--font-display);font-size:22px;letter-spacing:.02em;margin-bottom:1.25rem">
        Posts publicados e rascunhos
      </div>
      <div id="posts-lista"></div>
    </div>

    <!-- Formulário -->
    <div class="panel" id="post-form-panel" style="align-self:start;position:sticky;top:calc(var(--topbar-h,52px) + 1rem)">
      <div class="panel-head">
        <div id="form-titulo" class="panel-title">Novo post</div>
      </div>
      <div class="panel-body">
        <div style="display:flex;flex-direction:column;gap:.875rem">
          <div class="post-form-group">
            <label class="form-label">Título</label>
            <input class="form-input" id="post-titulo" placeholder="Título do post">
          </div>
          <div class="post-form-group">
            <label class="form-label">Categoria</label>
            <select class="form-select" id="post-categoria">
              <option value="" disabled selected>Selecione...</option>
              <option value="hackathon">Hackathon</option>
              <option value="projeto">Projeto entregue</option>
              <option value="conhecimento">Conhecimento</option>
            </select>
          </div>
          <div class="post-form-group">
            <label class="form-label">Conteúdo (Markdown)</label>
            <textarea class="form-input post-form-textarea" id="post-conteudo" placeholder="Escreva o conteúdo em Markdown...&#10;&#10;## Subtítulo&#10;&#10;Parágrafo com **negrito** e _itálico_."></textarea>
          </div>
          <div style="display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap">
            <button id="btn-cancelar" class="btn-sm" onclick="cancelarEdicao()" hidden>Cancelar</button>
            <button id="btn-salvar" class="btn-sm b" onclick="salvarPost()">Criar rascunho →</button>
          </div>
          <p style="font-size:11px;color:var(--muted);line-height:1.5">
            Posts são criados como rascunho. Clique em <strong style="color:var(--text)">Publicar →</strong> na lista para torná-los públicos no site.
          </p>
        </div>
      </div>
    </div>

  </div>
</main>
<script type="module" src="/assets/js/pages/novidades-diretoria.js"></script>
</body>
</html>
