<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil do Membro — Diretoria · IbBot & IbTech</title>
<link rel="icon" type="image/x-icon" href="/assets/icons/Documento-removebg-preview.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/global.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/dashboard.css">
<link rel="stylesheet" href="/assets/css/pages/dashboard-diretoria.css">
<link rel="stylesheet" href="/assets/css/ui/skeleton.css">
<link rel="stylesheet" href="/assets/css/ui/a11y.css">
<link rel="stylesheet" href="/assets/css/shell.css">
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteúdo</a>
<main id="main-content" class="content" style="padding: var(--sp-6) var(--sp-7); max-width: 900px">

  <a href="/membros/diretoria/membros" class="perfil-back">← Voltar para membros</a>

  <div class="perfil-grid">
    <div class="perfil-card">
      <div class="perfil-av-wrap">
        <div class="perfil-av" id="perfil-av">
          <span id="perfil-av-text">—</span>
        </div>
      </div>
      <div class="perfil-name" id="perfil-nome">—</div>
      <div class="perfil-role" id="perfil-cargo">Membro</div>
      <div class="perfil-liga-badge b" id="perfil-liga-badge">—</div>
      <div class="perfil-stats">
        <div class="perfil-stat">
          <div class="perfil-stat-num" id="stat-presenca">—</div>
          <div class="perfil-stat-label">Presença</div>
        </div>
        <div class="perfil-stat">
          <div class="perfil-stat-num" id="stat-entregas">—</div>
          <div class="perfil-stat-label">Entregas</div>
        </div>
        <div class="perfil-stat">
          <div class="perfil-stat-num" id="stat-encontros">—</div>
          <div class="perfil-stat-label">Encontros</div>
        </div>
      </div>
    </div>

    <div class="perfil-form">
      <div class="perfil-info-section">
        <div class="perfil-info-label">Bio</div>
        <p class="perfil-info-text" id="perfil-bio">—</p>
      </div>
      <div class="perfil-info-section">
        <div class="perfil-info-label">LinkedIn</div>
        <p class="perfil-info-text">
          <a class="perfil-info-link" id="perfil-linkedin" href="#" target="_blank" rel="noopener">—</a>
        </p>
      </div>
      <div class="perfil-info-section">
        <div class="perfil-info-label">GitHub</div>
        <p class="perfil-info-text">
          <a class="perfil-info-link" id="perfil-github" href="#" target="_blank" rel="noopener">—</a>
        </p>
      </div>
    </div>
  </div>

</main>
<script type="module" src="/assets/js/pages/perfil-membro-diretoria.js"></script>
</body>
</html>
