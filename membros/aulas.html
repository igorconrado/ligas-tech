<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aulas — Área de Membros · IbBot & IbTech</title>
<link rel="icon" type="image/x-icon" href="/assets/icons/Documento-removebg-preview.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/global.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/dashboard.css">
<link rel="stylesheet" href="/assets/css/ui/empty-state.css">
<link rel="stylesheet" href="/assets/css/ui/skeleton.css">
<link rel="stylesheet" href="/assets/css/ui/confirm.css">
<link rel="stylesheet" href="/assets/css/ui/a11y.css">
<link rel="stylesheet" href="/assets/css/shell.css">
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteúdo</a>
<main id="main-content" class="content" style="padding: var(--sp-6) var(--sp-7); max-width: 1100px">
  <div style="margin-bottom:var(--sp-5)">
    <div id="aulas-header-title" style="font-family:var(--font-display);font-size:var(--fs-h2);letter-spacing:.02em">Aulas</div>
    <div id="aulas-header-sub" style="font-size:12px;color:var(--muted);margin-top:2px"><span class="skeleton skeleton--text"></span></div>
  </div>

  <!-- Seção Aulas -->
  <div style="margin-bottom:var(--sp-5)">
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:var(--sp-3)">
      <div style="font-family:var(--font-display);font-size:var(--fs-h3,1.1rem);letter-spacing:.02em">Aulas</div>
      <span class="pill" style="background:var(--blue-soft,rgba(59,130,246,.15));color:var(--blue);font-size:10px" id="aulas-count"></span>
    </div>
    <div class="aulas-grid" id="aulas-grid"></div>
  </div>

  <!-- Seção Tarefas -->
  <div>
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:var(--sp-3)">
      <div style="font-family:var(--font-display);font-size:var(--fs-h3,1.1rem);letter-spacing:.02em">Tarefas</div>
      <span class="pill" style="background:var(--yellow-soft,rgba(234,179,8,.15));color:var(--yellow,#ca8a04);font-size:10px" id="tarefas-count"></span>
    </div>
    <div class="aulas-grid" id="tarefas-grid"></div>
  </div>
</main>
<script type="module" src="/assets/js/pages/aulas-membro.js"></script>
</body>
</html>
